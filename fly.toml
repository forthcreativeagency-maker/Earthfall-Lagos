app = "earthfall-mp"
primary_region = "lhr"

[build]

[env]
  PORT = "8080"
  DB_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "earthfall_data"
  destination = "/data"